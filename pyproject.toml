[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sql2tsql"
version = "0.1.0"
description = "Translate SQL from any sqlglot-supported dialect into T-SQL for SQL Server 2025"
requires-python = ">=3.10"
dependencies = [
    "sqlglot>=30.0,<31",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["sql2tsql"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
